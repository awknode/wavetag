[package]
name = "wave_tag"
version = "0.7.1"
edition = "2021"
authors = ["awk studios"]
description = "Tempo-synced LFO volume shaper / tremolo"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# AWKNODE: our nice-plug fork (~/Projects/nice-plug-awk), mounted at /nice-plug-awk by build.sh
nice-plug = { path = "/nice-plug-awk/crates/nice-plug" }
nice-plug-egui = { path = "/nice-plug-awk/crates/nice-plug-egui" }
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }
crossbeam = "0.8"
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"


# FL Studio fixes: patched baseview (vsync, paint, DPI, dummy-window crash). See nice-plug-awk/patches.
[patch.crates-io]
baseview = { path = "/nice-plug-awk/patches/baseview-0.4.2" }
