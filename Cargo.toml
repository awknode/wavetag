[package]
name = "wave_tag"
version = "0.7.0"
edition = "2021"
authors = ["awk studios"]
description = "Tempo-synced LFO volume shaper / tremolo"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
crossbeam = "0.8"
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

# AWKNODE: patched nih-plug (stalled-audio fallback), mounted at /nih-plug-awk by build.sh
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "/nih-plug-awk" }
nih_plug_egui = { path = "/nih-plug-awk/nih_plug_egui" }
